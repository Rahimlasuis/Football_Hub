<!DOCTYPE html>
<html>

<head>
    <title>Players and Player Cards</title>
    <style>
        .container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 20px 0;
        }

        button {
            background: #1a1e29;
            color: #a0aec0;
            border: 1px solid #2d3748;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button.active,
        button:hover {
            background: #00f0ff;
            color: #0d1117;
            border-color: #00f0ff;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }

        .player_grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .card {
            width: 230px;
            background: linear-gradient(135deg, #1e1e2f 0%, #111119 100%);
            border: 4px solid #ff007f;
            border-radius: 16px;
            padding: 20px;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-shadow: 0 10px 30px rgba(255, 0, 127, 0.2);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(255, 0, 127, 0.4);
        }

        .card_header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .player_rating {
            color: #ff007f;
            font-size: 15px;
        }

        .player_position {
            color: #00f0ff;
            font-size: 15px;
        }

        .player_image {
            margin: 20px auto;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid #00f0ff;
            overflow: hidden;
            background: #252538;
        }

        .player_photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .player_info {
            margin-bottom: 15px;
        }

        .player_name {
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 1px;
        }

        .player_team {
            margin: 5px 0 0 0;
            color: #aaa;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .stats_grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 8px;
        }

        .stat_box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .stat_value {
            font-weight: 700;
            font-size: 1.2rem;
            color: #ffffff;
        }

        .stat_label {
            font-size: 0.75rem;
            color: #888;
            font-weight: bold;
            margin-top: 2px;
        }

        .legend.card {
            border: 4px solid #00ff66;
        }

        .youngstar.card {
            border: 4px solid #ffd700;
        }
    </style>
</head>

<body>
    <div class="container">
        <button class="active all_btn" onclick="showAll()">All Players</button>
        <button class="young_btn" onclick="showYoungstar()">Young Stars</button>
        <button class="legend_btn" onclick="showLegend()">Past Legends</button>
    </div>

    <div id="player_grid" class="player_grid">
        <div class="card base" id="base">
            <div class="card_header">
                <span class="player_rating">99</span>
                <span class="player_position">AMF</span>
            </div>

            <div class="player_image">
                <img class="player_photo" src="../logos/messi-removebg-preview.png" alt="messi">
            </div>

            <div class="player_info">
                <h2 class="player_name">Raheem Abdul</h2>
                <p class="player_team">Nigeria</p>
            </div>
            <div class="stats_grid">
                <div class="stat_box">
                    <span class="stat_value">99</span>
                    <span class="stat_label">PAC</span>
                </div>
                <div class="stat_box">
                    <span class="stat_value">90</span>
                    <span class="stat_label">SHT</span>
                </div>
                <div class="stat_box">
                    <span class="stat_value">93</span>
                    <span class="stat_label">PAS</span>
                </div>
                <div class="stat_box">
                    <span class="stat_value">97</span>
                    <span class="stat_label">DRB</span>
                </div>
                <div class="stat_box">
                    <span class="stat_value">32</span>
                    <span class="stat_label">DEF</span>
                </div>
                <div class="stat_box">
                    <span class="stat_value">67</span>
                    <span class="stat_label">PHY</span>
                </div>
            </div>
        </div>
        <div class="card legend" id="legend">
            <div class="card_header">
                <span class="player_rating">99</span>
                <span class="player_position">AMF</span>
            </div>

            <div class="player_image">
                <img class="player_photo" src="../logos/messi-removebg-preview.png" alt="messi">
            </div>

            <div class="player_info">
                <h2 class="player_name">Raheem Abdul</h2>
                <p class="player_team">Nigeria</p>
            </div>
            <div class="stats_grid">
                <div class="stat_box">
                    <span class="stat_value">99</span>
                    <span class="stat_label">PAC</span>
                </div>
                <div class="stat_box">
                    <span class="stat_value">90</span>
                    <span class="stat_label">SHT</span>
                </div>
                <div class="stat_box">
                    <span class="stat_value">93</span>
                    <span class="stat_label">PAS</span>
                </div>
                <div class="stat_box">
                    <span class="stat_value">97</span>
                    <span class="stat_label">DRB</span>
                </div>
                <div class="stat_box">
                    <span class="stat_value">32</span>
                    <span class="stat_label">DEF</span>
                </div>
                <div class="stat_box">
                    <span class="stat_value">67</span>
                    <span class="stat_label">PHY</span>
                </div>
            </div>
        </div>
        <div class="card youngstar" id="youngstar">
            <div class="card_header">
                <span class="player_rating">99</span>
                <span class="player_position">AMF</span>
            </div>

            <div class="player_image">
                <img class="player_photo" src="../logos/messi-removebg-preview.png" alt="messi">
            </div>

            <div class="player_info">
                <h2 class="player_name">Raheem Abdul</h2>
                <p class="player_team">Nigeria</p>
            </div>
            <div class="stats_grid">
                <div class="stat_box">
                    <span class="stat_value">99</span>
                    <span class="stat_label">PAC</span>
                </div>
                <div class="stat_box">
                    <span class="stat_value">90</span>
                    <span class="stat_label">SHT</span>
                </div>
                <div class="stat_box">
                    <span class="stat_value">93</span>
                    <span class="stat_label">PAS</span>
                </div>
                <div class="stat_box">
                    <span class="stat_value">97</span>
                    <span class="stat_label">DRB</span>
                </div>
                <div class="stat_box">
                    <span class="stat_value">32</span>
                    <span class="stat_label">DEF</span>
                </div>
                <div class="stat_box">
                    <span class="stat_value">67</span>
                    <span class="stat_label">PHY</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showAll() {
            document.getElementById("youngstar").style.display = "block";
            document.getElementById("legend").style.display = "block";
            document.getElementById("base").style.display = "block";

            document.querySelector(".all_btn").classList.add("active");
            document.querySelector(".young_btn").classList.remove("active");
            document.querySelector(".legend_btn").classList.remove("active");
        }

        function showYoungstar() {
            document.getElementById("youngstar").style.display = "block";
            document.getElementById("legend").style.display = "none";
            document.getElementById("base").style.display = "none";

            document.querySelector(".young_btn").classList.add("active");
            document.querySelector(".all_btn").classList.remove("active");
            document.querySelector(".legend_btn").classList.remove("active");
        }

        function showLegend() {
            document.getElementById("legend").style.display = "block";
            document.getElementById("youngstar").style.display = "none";
            document.getElementById("base").style.display = "none";

            document.querySelector(".legend_btn").classList.add("active");
            document.querySelector(".all_btn").classList.remove("active");
            document.querySelector(".young_btn").classList.remove("active");
        }
    </script>
</body>

</html>
