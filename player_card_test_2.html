<!DOCTYPE html>
<html>

<head>
    <title>Player Card</title>
    <style>
        .card {
            width: 150px;
            background: linear-gradient(135deg, #1e1e2f 0%, #111119 100%);
            border: 2px solid #ff007f;
            border-radius: 16px;
            padding: 20px;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-shadow: 0 10px 30px rgba(255, 0, 127, 0.2);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(255, 0, 127, 0.4);
        }

        .card_header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 800;
            font-size: 1.2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .player_rating {
            color: #ff007f;
            font-size: 25px;
        }

        .player_position {
            color: #00f0ff;
            font-size: 25px;
        }

        .player_image {
            margin: 20px auto;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #00f0ff;
            overflow: hidden;
            background: #252538;
        }

        .player_photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .player_info {
            margin-bottom: 20px;
        }

        .player_name {
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 1px;
        }

        .player_team {
            margin: 5px 0 0 0;
            color: #aaa;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .stats_grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 8px;
        }

        .stat_box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .stat_value {
            font-weight: 700;
            font-size: 1.2rem;
            color: #ffffff;
        }

        .stat_label {
            font-size: 0.75rem;
            color: #888;
            font-weight: bold;
            margin-top: 2px;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="card_header">
            <span class="player_rating">99</span>
            <span class="player_position">AMF</span>
        </div>

        <div class="player_image">
            <img class="player_photo" src="logos/messi-removebg-preview.png" alt="messi">
        </div>

        <div class="player_info">
            <h2 class="player_name">Raheem Abdul</h2>
            <p class="player_team">Nigeria</p>
        </div>

        <div class="stats_grid">
            <div class="stat_box">
                <span class="stat_value">99</span>
                <span class="stat_label">PAC</span>
            </div>
            <div class="stat_box">
                <span class="stat_value">90</span>
                <span class="stat_label">SHT</span>
            </div>
            <div class="stat_box">
                <span class="stat_value">93</span>
                <span class="stat_label">PAS</span>
            </div>
            <div class="stat_box">
                <span class="stat_value">97</span>
                <span class="stat_label">DRB</span>
            </div>
            <div class="stat_box">
                <span class="stat_value">32</span>
                <span class="stat_label">DEF</span>
            </div>
            <div class="stat_box">
                <span class="stat_value">67</span>
                <span class="stat_label">PHY</span>
            </div>
        </div>
    </div>
</body>

</html>
