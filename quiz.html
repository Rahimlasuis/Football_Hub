<!DOCTYPE html>
<html>

<head>
    <title>Football Knowledge Quiz</title>
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        #header,
        #questions {
            max-width: 500px;
            margin: 40px auto;
            padding: 25px;
            background: #1a1e29;
            border-radius: 15px;
            border: 2px solid #2d3748;
            color: #ffffff;
            font-family: 'segoe ui', tahoma, geneva, verdana, sans-serif;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        h2,
        h3 {
            text-align: center;
            margin-bottom: 20px;
            color: #00f0ff;
        }

        #question_number {
            font-size: 0.9rem;
            text-transform: uppercase;
            color: #a0aec0;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        #question_text {
            font-size: 1.2rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        #header label {
            display: block;
            margin: 15px auto 5px auto;
            color: #cbd5e0;
            font-size: 0.9rem;
        }

        #header select {
            width: 100%;
            padding: 10px;
            background: #0f1219;
            border: 1px solid #4a5568;
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
        }

        #header select:focus {
            border-color: blue;
        }

        #options_container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 20px 0;
        }

        .option_btn {
            width: 100%;
            padding: 10px 20px;
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 15px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option_btn:hover {
            background-color: #e2e8f0;
            border-color: #cbd5e1;
            transform: translateY(-2px);
        }

        .option_btn.selected {
            background-color: #0d6efd;
            color: white;
            border-color: #0d6ef0;
        }

        .next_btn,
        .start_btn {
            width: 100%;
            margin-top: 20px;
            background: linear-gradient(135deg, #ff007f 0%, #7928ca 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .next_btn:hover,
        .start_btn:hover {
            background-color: #157347;
            opacity: 0.9;
        }
    </style>
</head>

<body>
    <div id="header">
        <h2>Test your Football Knowledge</h2>
        <label for="difficulty">Select Mode:</label>
        <select id="difficulty">
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
        </select>

        <label for="questions_number">Number of Questions:</label>
        <select id="questions_number">
            <option value="1">1 Questions</option>
            <option value="2">2 Questions</option>
            <option value="3">3 Questions</option>
        </select>

        <button onclick="startQuiz()" class="start_btn">Start Quiz</button>
    </div>


    <div id="questions" style="display: none;">
        <div id="question_number">Question 1</div>
        <h3 id="question_text">Question will appear in this div</h3>

        <div id="options_container">
        </div>

        <button id="next_btn" onclick="nextQuestion()" class="next_btn">Next Question</button>
    </div>



    <script>
        const questionBank = {
            easy: [
                {
                    question: "Which club has won the most UEFA Champions League titles?",
                    options: ["Real Madrid", "AC Milan", "Liverpool", "Barcelona"],
                    answer: "Real Madrid"
                },
                {
                    question: "Who is the all-time top scorer in the English Premier League?",
                    options: ["Alan Shearer", "Wayne Rooney", "Thierry Henry", "Sergio Agüero"],
                    answer: "Alan Shearer"
                },
                {
                    question: "Which country won the 2018 FIFA World Cup?",
                    options: ["Germany", "Brazil", "France", "Argentina"],
                    answer: "France"
                }
            ],
            medium: [
                {
                    question: "Which player has won the most Ballon d'Or awards?",
                    options: ["Lionel Messi", "Cristiano Ronaldo", "Michel Platini", "Johan Cruyff"],
                    answer: "Lionel Messi"
                },
                {
                    question: "Which club is known as 'The Red Devils'?",
                    options: ["Manchester United", "Liverpool", "Arsenal", "Chelsea"],
                    answer: "Manchester United"
                },
                {
                    question: "Who scored the winning goal in the 2010 FIFA World Cup final?",
                    options: ["Andrés Iniesta", "David Villa", "Xavi Hernández", "Fernando Torres"],
                    answer: "Andrés Iniesta"
                }
            ],
            hard: [
                {
                    question: "Which club did Diego Maradona play for in Italy?",
                    options: ["Juventus", "AC Milan", "Napoli", "Inter Milan"],
                    answer: "Napoli"
                },
                {
                    question: "Who is the youngest player to score in a FIFA World Cup match?",
                    options: ["Pele", "Kylian Mbappé", "Michael Owen", "Norman Whiteside"],
                    answer: "Pelé"
                },
                {
                    question: "Which country hosted the first FIFA World Cup in 1930?",
                    options: ["Uruguay", "Brazil", "Argentina", "Chile"],
                    answer: "Uruguay"
                }
            ]
        };

        let currentQuizQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;

        function startQuiz() {
            const selectedDifficulty = document.getElementById("difficulty").value;
            const requestedCount = parseInt(document.getElementById("questions_number").value);

            const pool = [...questionBank[selectedDifficulty]];

            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }

            currentQuizQuestions = pool.slice(0, Math.min(requestedCount, pool.length));

            if (currentQuizQuestions.length === 0) {
                alert("No questions available");
                return;
            }

            document.getElementById("header").style.display = "none";
            document.getElementById("questions").style.display = "block";

            currentQuestionIndex = 0;
            score = 0;
            displayQuestion();
        }

        function displayQuestion() {
            const current = currentQuizQuestions[currentQuestionIndex];

            document.getElementById("question_number").innerText = `Question ${currentQuestionIndex + 1} of ${currentQuizQuestions.length}`;
            document.getElementById("question_text").innerText = current.question;

            const optionsContainer = document.getElementById("options_container");
            optionsContainer.innerHTML = "";

            current.options.forEach((optionText) => {
                const btn = document.createElement("button");
                btn.classList.add("option_btn");
                btn.textContent = optionText;
                btn.onclick = () => selectedAnswer(optionText);
                optionsContainer.appendChild(btn);
            });
        }

        function selectedAnswer(selectedOption) {
            const current = currentQuizQuestions[currentQuestionIndex];
            if (selectedOption === current.answer) {
                score++;
            }
            nextQuestion();
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuizQuestions.length) {
                displayQuestion();
            } else {
                document.getElementById("questions").innerHTML = `
                <h2>Quiz Completed</h2>
                <p>Your Score is ${score} out of ${currentQuizQuestions.length}</p>
                <button onclick="Location.reload()">Reset Quiz</button>`
            }
        }
    </script>
</body>

</html>
