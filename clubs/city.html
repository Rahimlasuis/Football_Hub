<!DOCTYPE html>
<html>

<head>
    <title>Manchester City</title>
    <style>
        body {
            background-color: #0f172a;
            margin: 0;
            padding: 20px;
            color: #f8fafc;
        }

        .club_profile {
            max-width: 600px;
            margin: 40px auto;
        }

        .header {
            background: linear-gradient(135deg, #ebd115, #1d4ed8);
            border-radius: 20px;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            margin-bottom: 25px;
        }

        .club_title {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.4);
        }

        .club_subtitle {
            margin: 5px 0 0 0;
            font-size: 1rem;
            color: #ffffff;
            opacity: 0.95;
        }

        .rank {
            background: #ffffff;
            color: #1e293b;
            font-weight: 900;
            font-size: 1.5rem;
            padding: 12px 18px;
            border-radius: 12px;
        }

        .stats_grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .statbox {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .stat_label {
            color: #94a3b8;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .stat_value {
            font-size: 2rem;
            font-weight: 700;
            color: #ffffff;
        }

        .win {
            border-left: 5px solid #22c55e;
        }

        .draw {
            border-left: 5px solid #eab308;
        }

        .loss {
            border-left: 5px solid #ef4444;
        }

        .pts {
            border-left: 5px solid #3b82f6;
            background: linear-gradient(to right, #1e293b, #1d4ed822);
        }
    </style>
</head>

<body>
    <div class="club_profile">
        <header class="header">
            <div>
                <h1 class="club_title">Manchester City</h1>
                <p class="club_subtitle">Premier League</p>
            </div>
            <div class="rank">#2</div>
        </header>
        <main class="stats_grid">
            <div class="stat_box">
                <span class="stat_label">Games Played</span>
                <span class="stat_value">36</span>
            </div>
            <div class="stat_box win">
                <span class="stat_label">Games Won</span>
                <span class="stat_value">23</span>
            </div>
            <div class="stat_box draw">
                <span class="stat_label">Games Drawn</span>
                <span class="stat_value">8</span>
            </div>
            <div class="stat_box loss">
                <span class="stat_label">Games Lost</span>
                <span class="stat_value">5</span>
            </div>
            <div class="stat_box pts">
                <span class="stat_label">Total Points</span>
                <span class="stat_value">77</span>
            </div>
            <div class="stat_box gd">
                <span class="stat_label">Goal Difference</span>
                <span class="stat_value">43</span>
            </div>
        </main>
    </div>
    <p>Second in Premier League</p>
</body>

</html>
